<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#F4F6F6">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Chaves">
  <title>Controle de Chaves</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon-180.png">

  <!-- Estilos: fonte -> tokens de tema -> base -> estrutura -> componentes -> animações -->
  <link rel="stylesheet" href="css/fonts.css">
  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/motion.css">
</head>
<body>
  <!-- Cada tela é desenhada aqui por js/screens/*.js -->
  <main class="screen" id="screen"></main>

  <nav class="tabbar" aria-label="Seções">
    <div class="tabbar__inner">
      <button class="tab" type="button" data-view="home">
        <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="7" height="7" rx="2"/><rect x="14" y="3" width="7" height="7" rx="2"/><rect x="3" y="14" width="7" height="7" rx="2"/><rect x="14" y="14" width="7" height="7" rx="2"/></svg>Início
      </button>
      <button class="tab" type="button" data-view="board">
        <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="8" cy="15" r="4"/><path d="M11 12l9-9M17 6l3 3M15 8l2 2"/></svg>Quadro
      </button>
      <div class="fab-slot">
        <button class="fab" id="fab" type="button" aria-label="Registrar retirada">
          <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
        </button>
      </div>
      <button class="tab" type="button" data-view="report">
        <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>Relatório
      </button>
      <button class="tab" type="button" data-view="settings">
        <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M4.9 19.1L7 17M17 7l2.1-2.1"/></svg>Ajustes
      </button>
    </div>
  </nav>

  <!-- Núcleo: regras e dados (sem DOM) -->
  <script src="js/core/dates.js"></script>
  <script src="js/core/domain.js"></script>
  <script src="js/core/storage.js"></script>
  <script src="js/core/store.js"></script>
  <!-- Interface -->
  <script src="js/ui/dom.js"></script>
  <script src="js/ui/overlays.js"></script>
  <script src="js/ui/motion.js"></script>
  <script src="js/ui/components.js"></script>
  <!-- Relatório PDF e integração com o aparelho -->
  <script src="js/report/pdf-writer.js"></script>
  <script src="js/report/daily-report.js"></script>
  <script src="js/platform.js"></script>
  <script src="js/actions.js"></script>
  <!-- Folhas (formulários e detalhes) e telas -->
  <script src="js/sheets/checkout.js"></script>
  <script src="js/sheets/movement.js"></script>
  <script src="js/sheets/key.js"></script>
  <script src="js/screens/home.js"></script>
  <script src="js/screens/board.js"></script>
  <script src="js/screens/report.js"></script>
  <script src="js/screens/settings.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
